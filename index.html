<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clicker Dash: Runner Edition</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00ffff;
            --bg-dark: #0a0612;
        }
        body {
            margin: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #hud-top {
            display: flex;
            gap: 40px;
            font-size: 24px;
            color: #ffd700;
            margin: 15px 0;
            text-shadow: 0 0 10px #ffd700;
        }
        #game-frame {
            position: relative;
            width: 800px;
            height: 450px;
            background: #0d0618;
            border: 4px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 6, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            font-size: 32px;
            margin: 0 0 10px 0;
        }
        button {
            width: 260px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #2b1a4a;
            color: #fff;
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            transition: transform 0.1s, background 0.1s;
        }
        button:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 10px var(--neon-pink); }
        button:active { transform: scale(0.95); }

        .key-row {
            display: flex;
            justify-content: space-between;
            width: 320px;
            font-size: 18px;
            margin: 5px 0;
        }
        .key-btn {
            width: 120px;
            padding: 5px;
            font-size: 14px;
            border-color: var(--neon-blue);
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="hud-top">
        <div>💰 Coins: <span id="coin-count">0</span></div>
        <div>🏁 Checkpoints: <span id="cp-count">0</span></div>
        <div>🎯 Mode: <span id="current-mode">None</span></div>
    </div>
    
    <div id="game-frame">
        <canvas id="game-canvas" width="800" height="450"></canvas>

        <div id="menu-main" class="screen">
            <h2>CLICKER DASH</h2>
            <button onclick="showScreen('menu-modes')">▶️ PLAY GAME</button>
            <button onclick="showScreen('menu-shop')">🛒 SHOP ABILITIES</button>
            <button onclick="showScreen('menu-settings')">⚙️ SETTINGS</button>
            <button onclick="toggleFullscreen()">🖵 FULLSCREEN</button>
        </div>

        <div id="menu-modes" class="screen hidden">
            <h2>SELECT DIFFICULTY</h2>
            <button onclick="setDifficulty('Level Easy')" style="border-color: #00ff00;">🟢 LEVEL EASY</button>
            <button onclick="setDifficulty('Medium')" style="border-color: #ff9d00;">🟡 MEDIUM</button>
            <button onclick="setDifficulty('Chaos')" style="border-color: #ff3333;">🔴 CHAOS</button>
            <button onclick="showScreen('menu-main')" style="border-color: #888;">⬅️ BACK</button>
        </div>

        <div id="menu-shop" class="screen hidden">
            <h2>ABILITY SHOP</h2>
            <button id="shop-grapple" onclick="buyPowerUp('grapple', 15)">🪝 Grapple Hook<br>Cost: 15 coins</button>
            <button id="shop-magnet" onclick="buyPowerUp('magnet', 35)">🧲 Coin Magnet<br>Cost: 35 coins</button>
            <button id="shop-dash" onclick="buyPowerUp('dash', 50)">🚀 Dash Boost Ability<br>Cost: 50 coins</button>
            <button onclick="showScreen('menu-main')" style="border-color: #888;">⬅️ BACK</button>
        </div>

        <div id="menu-settings" class="screen hidden">
            <h2>CUSTOM KEYBINDS</h2>
            <div style="color: #aaa; font-size: 12px; margin-bottom: 10px;">Click an option then press any key to rebind</div>
            <div class="key-row"><span>Jump:</span><button class="key-btn" id="btn-jump" onclick="rebindAction('jump')">Space</button></div>
            <div class="key-row"><span>Duck/Slide:</span><button class="key-btn" id="btn-duck" onclick="rebindAction('duck')">KeyE</button></div>
            <div class="key-row"><span>Punch Object:</span><button class="key-btn" id="btn-punch" onclick="rebindAction('punch')">KeyR</button></div>
            <div class="key-row"><span>Grapple:</span><button class="key-btn" id="btn-hook" onclick="rebindAction('hook')">ShiftLeft</button></div>
            <div class="key-row"><span>Dash Ability:</span><button class="key-btn" id="btn-teleport" onclick="rebindAction('teleport')">KeyQ</button></div>
            <button onclick="showScreen('menu-main')" style="border-color: #888; margin-top: 15px;">⬅️ BACK</button>
        </div>

        <div id="menu-pause" class="screen hidden">
            <h2>GAME PAUSED</h2>
            <button onclick="resumeGame()">▶️ RESUME</button>
            <button onclick="quitToMenu()">🏠 QUIT TO MENU</button>
        </div>

        <div id="menu-gameover" class="screen hidden">
            <h2 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">💥 CRASHED!</h2>
            <p id="gameover-reason" style="color: #aaa; margin: 0;">Hit an obstacle</p>
            <button onclick="showScreen('menu-modes')">🔄 TRY AGAIN</button>
            <button onclick="quitToMenu()">🏠 MAIN MENU</button>
        </div>
    </div>
    <script>
        let gameData = {
            coins: 0,
            checkpoints: 0,
            powerups: { grapple: false, magnet: false, dash: false },
            keybinds: {
                jump: 'Space',
                duck: 'KeyE',
                punch: 'KeyR',
                hook: 'ShiftLeft',
                teleport: 'KeyQ'
            }
        };

        let currentDifficulty = 'Level Easy';
        let isGameRunning = false;
        let activeRebindAction = null;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const coinCountEl = document.getElementById('coin-count');
        const cpCountEl = document.getElementById('cp-count');
        const currentModeEl = document.getElementById('current-mode');
        const gameFrame = document.getElementById('game-frame');

        let player = {
            x: 100, y: 330, w: 40, h: 60,
            vy: 0, gravity: 1.2, jumpForce: -18,
            isJumping: false, isDucking: false, activeGrapple: false
        };

        let skyStars = [];
        let cityscape = [];
        let obstacles = [];
        let items = [];
        let gameSpeed = 5;
        let distanceTraveled = 0;

        function initWorldEnvironment() {
            skyStars = []; cityscape = []; obstacles = []; items = [];
            distanceTraveled = 0; gameData.checkpoints = 0;
            cpCountEl.textContent = 0;

            for(let i=0; i<40; i++) {
                skyStars.push({x: Math.random()*800, y: Math.random()*200, size: Math.random()*2});
            }
            for(let i=0; i<6; i++) {
                cityscape.push({
                    x: i * 160,
                    y: 150 + Math.random()*120,
                    w: 120 + Math.random()*40,
                    color: '#1a102f'
                });
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            if(screenId) document.getElementById(screenId).classList.remove('hidden');
        }

        function setDifficulty(mode) {
            currentDifficulty = mode;
            currentModeEl.textContent = mode;
            
            if(mode === 'Level Easy') gameSpeed = 4.5;
            else if(mode === 'Medium') gameSpeed = 7.5;
            else if(mode === 'Chaos') gameSpeed = 13;

            initWorldEnvironment();
            showScreen(null);
            isGameRunning = true;
        }

        function triggerGameOver(reason) {
            isGameRunning = false;
            document.getElementById('gameover-reason').textContent = reason;
            showScreen('menu-gameover');
        }

        function resumeGame() {
            isGameRunning = true;
            showScreen(null);
        }

        function quitToMenu() {
            isGameRunning = false;
            showScreen('menu-main');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameFrame.requestFullscreen().catch(err => {alert(err.message);});
            } else {
                document.exitFullscreen();
            }
        }

        function rebindAction(action) {
            activeRebindAction = action;
            document.getElementById(`btn-${action}`).textContent = '⏳ Press...';
        }

        function updatePhysicsLoop() {
            if (!isGameRunning) return;

            distanceTraveled += gameSpeed;
            if(Math.floor(distanceTraveled) % 2500 === 0) {
                gameData.checkpoints++;
                cpCountEl.textContent = gameData.checkpoints;
            }

            if (player.activeGrapple) {
                player.y -= 10;
                if(player.y <= 100) { player.y = 100; player.activeGrapple = false; }
            } else {
                player.vy += player.gravity;
                player.y += player.vy;
            }

            if(player.y >= 330) {
                player.y = 330;
                player.vy = 0;
                player.isJumping = false;
            }

            if(Math.random() < 0.015 && obstacles.length < 3) {
                let typeRand = Math.random();
                let obsType = 'tall'; 
                if(typeRand > 0.5) obsType = 'low'; 
                if(typeRand > 0.8) obsType = 'box'; 

                obstacles.push({
                    x: 850,
                    y: obsType === 'low' ? 290 : 330,
                    w: 30, h: obsType === 'low' ? 30 : 60,
                    type: obsType
                });
            }

            if(Math.random() < 0.02 && items.length < 5) {
                items.push({ x: 850, y: 250 + Math.random()*80, w: 20, collected: false });
            }

            cityscape.forEach(b => {
                b.x -= gameSpeed * 0.3;
                if(b.x + b.w < 0) b.x = 850;
            });

            obstacles.forEach((o, index) => {
                o.x -= gameSpeed;
                
                let px = player.x, py = player.isDucking ? player.y + 30 : player.y;
                let pw = player.w, ph = player.isDucking ? 30 : player.h;

                if (px < o.x + o.w && px + pw > o.x && py < o.y + o.h && py + ph > o.y) {
                    triggerGameOver(o.type === 'low' ? "Failed to slide under barrier!" : "Crashed into barrier building structure!");
                }
                if(o.x < -50) obstacles.splice(index, 1);
            });

            items.forEach((coin, index) => {
                coin.x -= gameSpeed;

                if(gameData.powerups.magnet) {
                    let dx = player.x - coin.x;
                    let dy = player.y - coin.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 200) {
                        coin.x += (dx / dist) * 12;
                        coin.y += (dy / dist) * 12;
                    }
                }

                if (player.x < coin.x + coin.w && player.x + player.w > coin.x && player.y < coin.y + coin.w && player.y + player.h > coin.y) {
                    gameData.coins += 1;
                    coinCountEl.textContent = gameData.coins;
                    items.splice(index, 1);
                }
                if(coin.x < -50) items.splice(index, 1);
            });
        }
        function drawVisualLayer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#090314';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            skyStars.forEach(s => ctx.fillRect(s.x, s.y, s.size, s.size));

            cityscape.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.w, 450 - b.y);
                ctx.fillStyle = '#2d1b4e';
                ctx.fillRect(b.x, b.y, 4, 450 - b.y); 
            });

            ctx.fillStyle = '#1c1130';
            ctx.fillRect(0, 390, canvas.width, 60);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-pink').trim() || '#ff007f';
            ctx.fillRect(0, 390, canvas.width, 4);

            items.forEach(coin => {
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(coin.x + 10, coin.y + 10, 10, 0, Math.PI*2);
                ctx.fill();
            });

            obstacles.forEach(o => {
                if(o.type === 'box') ctx.fillStyle = '#ff9d00';
                else if(o.type === 'low') ctx.fillStyle = '#ff3333';
                else ctx.fillStyle = '#ffff00';
                ctx.fillRect(o.x, o.y, o.w, o.h);
            });

            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon-blue').trim() || '#00ffff';
            if(player.isDucking) {
                ctx.fillRect(player.x, player.y + 30, player.w, 30);
            } else {
                ctx.fillRect(player.x, player.y, player.w, player.h);
            }

            if(player.activeGrapple) {
                ctx.strokeStyle = '#00ffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(player.x + 20, player.y);
                ctx.lineTo(player.x + 80, 50);
                ctx.stroke();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (activeRebindAction) {
                gameData.keybinds[activeRebindAction] = e.code;
                let cleanText = e.code.replace('Key', '');
                if(e.code === 'Space') cleanText = 'Space';
                document.getElementById(`btn-${activeRebindAction}`).textContent = cleanText;
                activeRebindAction = null;
                return;
            }

            if (e.code === 'Escape' && isGameRunning) {
                isGameRunning = false;
                showScreen('menu-pause');
                return;
            }

            if (isGameRunning) {
                if (e.code === gameData.keybinds.jump && !player.isJumping && !player.isDucking) {
                    player.vy = player.jumpForce;
                    player.isJumping = true;
                    gameData.coins += 1; 
                    coinCountEl.textContent = gameData.coins;
                }
                if (e.code === gameData.keybinds.duck) {
                    player.isDucking = true;
                }
                if (e.code === gameData.keybinds.punch) {
                    obstacles.forEach((o, index) => {
                        if(o.type === 'box' && o.x - player.x < 120 && o.x > player.x) {
                            obstacles.splice(index, 1); 
                        }
                    });
                }
                if (e.code === gameData.keybinds.hook && gameData.powerups.grapple) {
                    player.activeGrapple = true;
                }
                if (e.code === gameData.keybinds.teleport && gameData.powerups.dash) {
                    player.x += 180;
                    setTimeout(() => { player.x = 100; }, 250); 
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === gameData.keybinds.duck) player.isDucking = false;
        });

        function buyPowerUp(item, cost) {
            if (gameData.coins >= cost && !gameData.powerups[item]) {
                gameData.coins -= cost;
                gameData.powerups[item] = true;
                coinCountEl.textContent = gameData.coins;
                document.getElementById(`shop-${item}`).disabled = true;
                document.getElementById(`shop-${item}`).textContent = `✅ UNLOCKED`;
            } else if(gameData.powerups[item]) {
                alert("Already purchased!");
            } else {
                alert("Need more coins!");
            }
        }

        setInterval(() => {
            updatePhysicsLoop();
            drawVisualLayer();
        }, 1000 / 60);

        initWorldEnvironment();
        showScreen('menu-main');
    </script>
</body>
</html>
