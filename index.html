<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clicker Dash: Runner Edition</title>
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-blue: #00ffff;
            --bg-dark: #0a0612;
            --panel-bg: #140d24;
        }
        body {
            margin: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        #hud-top {
            display: flex;
            gap: 40px;
            font-size: 24px;
            color: #ffd700;
            margin: 15px 0;
            text-shadow: 0 0 10px #ffd700;
        }
        #game-frame {
            position: relative;
            width: 800px;
            height: 450px;
            background: linear-gradient(#1f1235, #0d0618);
            border: 4px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
            border-radius: 10px;
            overflow: hidden;
        }
        /* Overlays for Menus */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 6, 18, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        h2 {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            font-size: 32px;
            margin: 0 0 10px 0;
        }
        button {
            width: 220px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #2b1a4a;
            color: #fff;
            border: 2px solid var(--neon-pink);
            cursor: pointer;
            border-radius: 6px;
            text-align: center;
            transition: transform 0.1s, background 0.1s;
        }
        button:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 10px var(--neon-pink); }
        button:active { transform: scale(0.95); }

        /* Keybind Input Styling */
        .key-row {
            display: flex;
            justify-content: space-between;
            width: 300px;
            font-size: 18px;
            margin: 5px 0;
        }
        .key-btn {
            width: 100px;
            padding: 5px;
            font-size: 14px;
            border-color: var(--neon-blue);
        }

        /* Active Gameplay Canvas Elements */
        #game-world {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        #player {
            position: absolute;
            bottom: 60px;
            left: 100px;
            width: 40px;
            height: 60px;
            background: var(--neon-blue);
            border: 2px solid #fff;
            box-shadow: 0 0 15px var(--neon-blue);
        }
        #ground {
            position: absolute;
            bottom: 0; width: 100%; height: 60px;
            background: #1c1130;
            border-top: 4px solid var(--neon-pink);
        }
    </style>
</head>
<body>

    <div id="hud-top">
        <div>💰 Coins: <span id="coin-count">0</span></div>
        <div>🏁 Checkpoint: <span id="cp-count">0</span></div>
        <div>🎯 Mode: <span id="current-mode">None</span></div>
    </div>
    
    <div id="game-frame" id="main-view">
        <!-- Live Action Gameplay Sandbox -->
        <div id="game-world">
            <div id="player"></div>
            <div id="ground"></div>
        </div>

        <!-- Main Menu -->
        <div id="menu-main" class="screen">
            <h2>CLICKER DASH</h2>
            <button onclick="showScreen('menu-modes')">▶️ PLAY GAME</button>
            <button onclick="showScreen('menu-shop')">🛒 SHOP POwER-UPS</button>
            <button onclick="showScreen('menu-settings')">⚙️ SETTINGS</button>
            <button onclick="toggleFullscreen()">🖵 FULLSCREEN</button>
        </div>

        <!-- Difficulty Mode Select -->
        <div id="menu-modes" class="screen hidden">
            <h2>SELECT DIFFICULTY</h2>
            <button onclick="setDifficulty('Easy')" style="border-color: #00ff00;">🟢 EASY (Buildings)</button>
            <button onclick="setDifficulty('Medium')" style="border-color: #ff9d00;">🟡 MEDIUM (Fast)</button>
            <button onclick="setDifficulty('Hard')" style="border-color: #ff3333;">🔴 HARD (Chaos)</button>
            <button onclick="showScreen('menu-main')" style="border-color: #888;">⬅️ BACK</button>
        </div>

        <!-- Shop Menu -->
        <div id="menu-shop" class="screen hidden">
            <h2>POWER-UP SHOP</h2>
            <button id="shop-grapple" onclick="buyPowerUp('grapple', 50)">🪝 Grapple Hook<br>Cost: 50 coins</button>
            <button id="shop-shield" onclick="buyPowerUp('shield', 30)">🛡️ Shield Active<br>Cost: 30 coins</button>
            <button onclick="showScreen('menu-main')" style="border-color: #888;">⬅️ BACK</button>
        </div>

        <!-- Settings Keybinds Configuration -->
        <div id="menu-settings" class="screen hidden">
            <h2>CUSTOM KEYBINDS</h2>
            <div style="color: #aaa; font-size: 12px; margin-bottom: 10px;">Click a button then press any key to rebind</div>
            <div class="key-row"><span>Jump:</span><button class="key-btn" id="btn-jump" onclick="rebindAction('jump')">Space</button></div>
            <div class="key-row"><span>Duck:</span><button class="key-btn" id="btn-duck" onclick="rebindAction('duck')">KeyE</button></div>
            <div class="key-row"><span>Punch:</span><button class="key-btn" id="btn-punch" onclick="rebindAction('punch')">KeyR</button></div>
            <button onclick="showScreen('menu-main')" style="border-color: #888; margin-top: 15px;">⬅️ BACK</button>
        </div>

        <!-- Active HUD Pause Overlay -->
        <div id="menu-pause" class="screen hidden">
            <h2>GAME PAUSED</h2>
            <button onclick="resumeGame()">▶️ RESUME</button>
            <button onclick="quitToMenu()">🏠 QUIT TO MENU</button>
        </div>
    </div>

    <script>
        // --- GAME CONTROL CONFIGURATION ---
        let gameData = {
            coins: 0,
            checkpoints: 0,
            powerups: { grapple: false, shield: false },
            keybinds: {
                jump: 'Space',
                duck: 'KeyE',
                punch: 'KeyR'
            }
        };

        let currentDifficulty = 'Easy';
        let isGameRunning = false;
        let activeRebindAction = null;

        // UI Target Pointers
        const coinCountEl = document.getElementById('coin-count');
        const cpCountEl = document.getElementById('cp-count');
        const currentModeEl = document.getElementById('current-mode');
        const gameFrame = document.getElementById('game-frame');

        // Initialize Settings Panel Screen View Changes
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            if(screenId) {
                document.getElementById(screenId).classList.remove('hidden');
            }
        }

        // Handle Active Run Engine Speeds and Initiation Controls
        function setDifficulty(mode) {
            currentDifficulty = mode;
            currentModeEl.textContent = mode;
            showScreen(null); // Clear overlays
            isGameRunning = true;
            // Gameplay simulation loop begins here next!
        }

        function resumeGame() {
            isGameRunning = true;
            showScreen(null);
        }

        function quitToMenu() {
            isGameRunning = false;
            showScreen('menu-main');
        }

        // Fullscreen Mode Handler Engine Hooks
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                gameFrame.requestFullscreen().catch(err => {
                    alert(`Error enabling fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Custom Keybinding Assignment Routines
        function rebindAction(action) {
            activeRebindAction = action;
            document.getElementById(`btn-${action}`).textContent = '⏳ Press...';
        }

        window.addEventListener('keydown', (e) => {
            // Rebinding System Trigger Check
            if (activeRebindAction) {
                gameData.keybinds[activeRebindAction] = e.code;
                let cleanText = e.code.replace('Key', '');
                if(e.code === 'Space') cleanText = 'Space';
                document.getElementById(`btn-${activeRebindAction}`).textContent = cleanText;
                activeRebindAction = null;
                return;
            }

            // Pause Input System Key Check
            if (e.code === 'Escape' && isGameRunning) {
                isGameRunning = false;
                showScreen('menu-pause');
                return;
            }

            // Active Core Running Gameplay Controller Routine Checks
            if (isGameRunning) {
                if (e.code === gameData.keybinds.jump) {
                    // Trigger Jump Mechanics
                    gameData.coins += 1; // 1 coin awarded per jump action sequence rules
                    coinCountEl.textContent = gameData.coins;
                }
                if (e.code === gameData.keybinds.duck) {
                    // Trigger Character Slide/Duck Mechanics
                }
                if (e.code === gameData.keybinds.punch) {
                    // Action Breakable Target Destruct Rules
                }
            }
        });

        // Store Logic Purchase Upgrades Manager Engine Checks
        function buyPowerUp(item, cost) {
            if (gameData.coins >= cost && !gameData.powerups[item]) {
                gameData.coins -= cost;
                gameData.powerups[item] = true;
                coinCountEl.textContent = gameData.coins;
                document.getElementById(`shop-${item}`).disabled = true;
                document.getElementById(`shop-${item}`).textContent = `✅ UNLOCKED`;
            } else if(gameData.powerups[item]) {
                alert("Already purchased!");
            } else {
                alert("Not enough coins!");
            }
        }
    </script>
</body>
</html>
